<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deli Dispensary Pricing Calculator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Theme Colors - Change these to instantly update the whole app */
            --brand-primary: #10b981;    /* Emerald green */
            --brand-secondary: #047857;  /* Dark green */
            --brand-accent: #d1fae5;     /* Light green background */
            --bg-main: #f3f4f6;          /* App background */
            --bg-surface: #ffffff;       /* Card background */
            --text-main: #1f2937;        /* Primary text */
            --text-muted: #6b7280;       /* Secondary text */
            --border-color: #e5e7eb;     /* Borders and dividers */
            --shadow-color: rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Input styling to remove default spinners cleanly */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--brand-primary)',
                        secondary: 'var(--brand-secondary)',
                        accent: 'var(--brand-accent)',
                        background: 'var(--bg-main)',
                        surface: 'var(--bg-surface)',
                        content: 'var(--text-main)',
                        muted: 'var(--text-muted)',
                        border: 'var(--border-color)',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center items-start font-sans">

    <main class="w-full max-w-6xl space-y-6">
        
        <header class="text-center space-y-2 mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-accent text-primary mb-2 shadow-sm">
                <i class="fa-solid fa-leaf text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-content tracking-tight">Deli Pricing Calculator</h1>
            <p class="text-muted">Calculate retail margins and standard weight brackets from bulk cost.</p>
        </header>

        <section class="bg-surface p-6 rounded-2xl shadow-sm border border-border">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div>
                    <label for="costPerLb" class="block text-sm font-semibold text-content mb-2">
                        Cost per Pound (1 lb = 453.59g) <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-boxes-stacked text-muted"></i>
                        </div>
                        <input 
                            type="number" 
                            id="costPerLb" 
                            class="block w-full pl-10 pr-4 py-3 text-lg border border-border rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-colors bg-background text-content placeholder-muted" 
                            placeholder="e.g., 1200"
                            oninput="calculatePrices()"
                        >
                    </div>
                    <div class="mt-3 flex items-center gap-2 text-sm text-primary font-medium bg-accent px-3 py-2 rounded-lg w-fit">
                        <i class="fa-solid fa-scale-balanced"></i>
                        Base Cost per Gram: <span id="baseCostOutput">$0.00</span>
                    </div>
                </div>

                <div>
                    <label for="targetPricePerGram" class="block text-sm font-semibold text-content mb-2">
                        Target Retail Price (per gram) <span class="text-muted font-normal text-xs ml-1">(Optional)</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-bullseye text-muted"></i>
                        </div>
                        <input 
                            type="number" 
                            id="targetPricePerGram" 
                            class="block w-full pl-10 pr-4 py-3 text-lg border border-border rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-colors bg-background text-content placeholder-muted" 
                            placeholder="e.g., 10"
                            oninput="calculatePrices()"
                        >
                    </div>
                    <p class="mt-3 text-sm text-muted">
                        Enter a target price to reverse-calculate the exact margin multiplier.
                    </p>
                </div>

            </div>
        </section>

        <section id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 hidden">
            </section>

    </main>

    <script>
        // Standard cannabis weights in grams
        const WEIGHTS = {
            '1g': 1,
            '1/8 oz': 3.5,
            '1/4 oz': 7,
            '1/2 oz': 14,
            '1 oz': 28
        };

        // Requested standard markup multipliers
        const MULTIPLIERS = [
            { label: 'Standard', rate: 2.15, icon: 'fa-bolt' },
            { label: 'Plus', rate: 2.5, icon: 'fa-arrow-trend-up' },
            { label: 'Premium', rate: 3.0, icon: 'fa-gem' },
            { label: 'Max', rate: 4.0, icon: 'fa-rocket' }
        ];

        const GRAMS_PER_POUND = 453.592;

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(amount);
        }

        function createCardHTML(markupRate, retailPricePerGram, label, icon, isCustom = false) {
            let breakdownHTML = '';
            for (const [weightLabel, grams] of Object.entries(WEIGHTS)) {
                const price = formatCurrency(retailPricePerGram * grams);
                
                // Highlight the 1g price
                const isGram = weightLabel === '1g';
                const rowClass = isGram ? 'text-primary font-bold bg-accent -mx-4 px-4 py-2 rounded-lg' : 'text-content py-1';
                
                breakdownHTML += `
                    <div class="flex justify-between items-center text-sm ${rowClass} mb-1">
                        <span class="${isGram ? '' : 'text-muted'}">${weightLabel}</span>
                        <span>${price}</span>
                    </div>
                `;
            }

            // Differentiate custom target card visually
            const borderClass = isCustom ? 'border-2 border-primary ring-4 ring-accent' : 'border border-border';
            const topBarClass = isCustom ? 'bg-primary h-2' : 'bg-secondary h-1';

            return `
                <div class="bg-surface ${borderClass} rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden flex flex-col h-full">
                    <div class="absolute top-0 left-0 w-full ${topBarClass}"></div>
                    <div class="flex justify-between items-center mb-4 mt-2">
                        <h3 class="font-bold text-content text-lg">${markupRate}x Margin</h3>
                        <div class="w-8 h-8 rounded-full bg-accent flex items-center justify-center text-primary">
                            <i class="fa-solid ${icon} text-sm"></i>
                        </div>
                    </div>
                    
                    <div class="mb-5 flex-grow">
                        <div class="text-xs text-muted uppercase tracking-wider font-semibold mb-1">${label} Tier</div>
                        <div class="text-3xl font-black text-content">${formatCurrency(retailPricePerGram)}<span class="text-sm font-normal text-muted"> /g</span></div>
                    </div>

                    <div class="pt-4 border-t border-border">
                        <div class="text-xs text-muted font-semibold mb-3 uppercase tracking-wider">Weight Breakdown</div>
                        ${breakdownHTML}
                    </div>
                </div>
            `;
        }

        function calculatePrices() {
            const costInput = document.getElementById('costPerLb');
            const targetInput = document.getElementById('targetPricePerGram');
            const resultsGrid = document.getElementById('resultsGrid');
            const baseCostOutput = document.getElementById('baseCostOutput');
            
            const costPerLb = parseFloat(costInput.value);
            const targetPrice = parseFloat(targetInput.value);

            // If base cost input is invalid or cleared, hide the results
            if (isNaN(costPerLb) || costPerLb <= 0) {
                resultsGrid.classList.add('hidden');
                baseCostOutput.innerText = "$0.00";
                return;
            }

            // Calculate base cost
            const baseCostPerGram = costPerLb / GRAMS_PER_POUND;
            baseCostOutput.innerText = formatCurrency(baseCostPerGram);
            
            // Clear previous results and show grid
            resultsGrid.innerHTML = '';
            resultsGrid.classList.remove('hidden');

            // 1. Generate Custom Target Card (if provided)
            if (!isNaN(targetPrice) && targetPrice > 0) {
                const customRate = (targetPrice / baseCostPerGram).toFixed(2);
                const customCard = document.createElement('div');
                customCard.innerHTML = createCardHTML(customRate, targetPrice, 'Custom Target', 'fa-crosshairs', true);
                resultsGrid.appendChild(customCard.firstElementChild);
            }

            // 2. Generate Standard Multiplier Cards
            MULTIPLIERS.forEach(markup => {
                const retailPricePerGram = baseCostPerGram * markup.rate;
                const card = document.createElement('div');
                card.innerHTML = createCardHTML(markup.rate, retailPricePerGram, markup.label, markup.icon);
                resultsGrid.appendChild(card.firstElementChild);
            });
        }
    </script>
</body>
</html>
